name: build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --quiet --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --quiet --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install ldid
        run: brew install ldid

      - name: Build
        run: |
          export THEOS=$HOME/theos
          make

      - name: List output
        run: find .theos/obj -name '*.dylib' -print

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libhpkedumper-dylib
          path: |
            .theos/obj/**/*.dylib
            .theos/obj/*.dylib
          if-no-files-found: error
