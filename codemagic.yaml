workflows:
  hpke-build:
    name: HPKE Dumper Build
    instance_type: mac_mini_m2
    max_build_duration: 10
    scripts:
      - name: Install deps
        script: |
          set -e
          brew install ldid 2>/dev/null || true
          export THEOS=$HOME/theos
          if [ ! -d "$THEOS" ]; then
            git clone --quiet --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
            rm -rf "$THEOS/sdks"
            git clone --quiet --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          fi
      - name: Build dylib
        script: |
          set -e
          export THEOS=$HOME/theos
          make 2>&1 | tee build.log
          find .theos/obj -name '*.dylib' -print
          # Copy to root for easy artifact pickup
          dylib=$(find .theos/obj -name 'libhpkedumper.dylib' | head -1)
          cp "$dylib" libhpkedumper.dylib
          echo "OK: libhpkedumper.dylib"
    artifacts:
      - build.log
      - libhpkedumper.dylib
