workflows:
  hpke-build:
    name: HPKE Dumper Build
    instance_type: mac_mini_m2
    max_build_duration: 15
    scripts:
      - name: Install deps + Theos
        script: |
          set -e
          brew install ldid 2>/dev/null || true
          export THEOS=$HOME/theos
          if [ ! -d "$THEOS" ]; then
            git clone --quiet --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
            rm -rf "$THEOS/sdks"
            git clone --quiet --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          fi
      - name: Build Dobby (static, arm64+arm64e)
        script: |
          set -e
          git clone --quiet --depth 1 https://github.com/jmpews/Dobby.git dobby-src
          cmake -S dobby-src -B dobby-build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;arm64e" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DDOBBY_DEBUG=OFF
          cmake --build dobby-build --config Release --target dobby_static
          libtool -static -o libdobby.a $(find dobby-build -name '*.a')
          cp "$(find dobby-src -name 'dobby.h' | head -1)" ./dobby.h
          echo "=== Dobby ===" && ls -la libdobby.a dobby.h && lipo -info libdobby.a
      - name: Build dylib
        script: |
          set -e
          export THEOS=$HOME/theos
          make 2>&1 | tee build.log
          find .theos/obj -name '*.dylib' -print
          dylib=$(find .theos/obj -name 'libhpkedumper.dylib' | head -1)
          cp "$dylib" libhpkedumper.dylib
          echo "OK: libhpkedumper.dylib"
    artifacts:
      - build.log
      - libhpkedumper.dylib
